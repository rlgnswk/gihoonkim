<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>
<script>
  document.addEventListener('keydown', function (event) {
    if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('#theme-toggle a')) {
      event.preventDefault();
      event.target.click();
    }
  });
</script>
